<style>
:root{--y:#2BD9A4;--bg:#F3F8F5;--c:#fff;--t:#111;--m:#5b6f66;--l:#dbe8e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0C1512;--c:#14211C;--t:#ECF5F0;--m:#8FA89D;--l:#223229}}
:root[data-theme=dark]{--bg:#0C1512;--c:#14211C;--t:#ECF5F0;--m:#8FA89D;--l:#223229}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--t);font-size:15px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--y);z-index:10}
header{background:var(--y);color:#111;padding:14px 16px;border-radius:0 0 28px 28px;text-align:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
header img{height:44px}#shopn{font-size:12px;font-weight:700;margin-top:2px}
main{max-width:560px;margin:auto;padding:18px 16px 110px}
.pg{animation:pg .35s ease}@keyframes pg{from{opacity:0;transform:translateY(14px)}}
h2{font-size:20px;margin-bottom:12px}h3{font-size:15px;margin:16px 0 8px}small{color:var(--m);font-size:12px}
.card{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:14px;margin-bottom:12px;display:grid;gap:8px;animation:pg .3s ease}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:0;background:var(--y);color:#111;font:inherit;font-weight:700;padding:13px 18px;border-radius:16px;cursor:pointer;transition:transform .15s}.btn:active{transform:scale(.95)}
.ghost{background:transparent;border:2px solid var(--t);color:var(--t)}.btn.w{width:100%}
input,select{width:100%;padding:11px 12px;border-radius:14px;border:1.5px solid var(--l);background:var(--bg);color:var(--t);font:inherit;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--t)}
.seg{display:flex;background:var(--l);border-radius:18px;padding:4px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;color:var(--t);font:inherit;font-weight:700;padding:10px;border-radius:14px;transition:.25s}.seg .on{background:#111;color:var(--y)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.stats div{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:12px 8px;text-align:center;display:grid}.stats b{font-size:15px;margin-top:4px}.stats .pf{background:#111;color:var(--y)}.stats .pf small{color:var(--y)}
.al{background:#111;color:var(--y);border-radius:16px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;font-size:13px;animation:pg .3s}
.bd{background:var(--y);color:#111;border-radius:99px;padding:3px 12px;font-weight:700;font-size:13px}.bd.bad{background:#111;color:var(--y)}
.x{border:0;background:var(--l);color:var(--t);border-radius:50%;width:28px;height:28px}.em{color:var(--m);text-align:center;padding:30px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:0;border-radius:24px 24px 0 0;display:grid;grid-template-columns:repeat(6,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:8}
nav button{border:0;background:none;color:#bbb;font:inherit;font-size:11px;padding:6px 0;border-radius:16px;transition:.25s;display:grid;gap:2px}nav button span{font-size:19px}nav .on{background:#ffffff24;color:var(--y);font-weight:700}nav img{width:25px;height:25px;margin:auto;display:block}
.ft{flex-direction:column;text-align:center;margin-top:24px;font-size:12px;color:var(--m);display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.ic{width:26px;height:26px;border-radius:8px;background:#111;color:var(--y);display:grid;place-items:center;font-weight:900}
#modal .ov{position:fixed;inset:0;background:#0008;z-index:30;display:grid;place-items:center;padding:16px;animation:fd .2s}@keyframes fd{from{opacity:0}}
.box{background:var(--c);border-radius:26px;padding:20px;width:100%;max-width:360px;display:grid;gap:12px;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.8);opacity:0}}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:700}.ch button{border:0;background:var(--y);color:#111;width:34px;height:34px;border-radius:50%;font-size:18px}
.wd,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:var(--m)}.cg{font-size:14px;color:var(--t)}.cg b{padding:8px 0;border-radius:12px;cursor:pointer;font-weight:400}.cg .td{border:1.5px solid var(--t)}.cg .on{background:#111;color:var(--y)}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#111;color:var(--y);padding:10px 18px;border-radius:99px;z-index:40;font-size:13px;animation:pg .3s}
#view{position:fixed;inset:0;background:#4a4b45;overflow:auto;z-index:20;display:none;padding:64px 0 24px}
.vb{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:#111;z-index:21}.vb .btn{padding:9px 14px}
.sheet{width:210mm;height:297mm;margin:0 auto;background:#fff;color:#111;position:relative;overflow:hidden;font-size:11px;direction:rtl}
.sh{background:linear-gradient(120deg,#CFF9FF,#CFFFE8);height:44mm;padding:8mm 10mm;display:flex;align-items:center;gap:6mm;border-radius:0 0 10mm 10mm}
.lg{width:26mm;height:26mm;background:#fff;border:.8mm solid #3ED8BE;border-radius:5mm;display:grid;place-items:center;overflow:hidden;flex:none;font-size:30px;font-weight:900}.lg img{width:100%;height:100%;object-fit:contain}
.si{flex:1;min-width:0}.si h1{font-size:22px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.si p{font-size:11px;max-height:2.8em;overflow:hidden}
.sm{width:42mm;flex:none}.tt{background:#fff;color:#111;border:.3mm solid #111;padding:2mm;border-radius:99px;font-weight:800;font-size:15px;text-align:center;margin-bottom:2mm}.sm p{white-space:nowrap}
.pt{margin:6mm 10mm 4mm;padding:0 5mm;border:.3mm solid #A9E6DA;border-radius:4mm;height:11mm;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sheet table{width:190mm;margin:0 10mm;border-collapse:separate;border-spacing:0;table-layout:fixed;border:.4mm solid #A9E6DA;border-radius:4mm;overflow:hidden}
.sheet th{background:#E3FFF8;color:#111;height:9mm;font-size:11px}.sheet td{height:9mm;text-align:center;border-top:.2mm solid #ddd;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2mm;font-size:11px}
.sheet tr:nth-child(odd) td{background:#F3FFFC}.sheet td.l{text-align:right}
.tl{margin:5mm 10mm 0;display:flex;justify-content:space-between;gap:6mm}.tb{width:80mm;border:.4mm solid #A9E6DA;border-radius:4mm;overflow:hidden}.tb div{display:flex;justify-content:space-between;padding:2mm 4mm;height:8mm;align-items:center}.tb .gt{background:#C9FBEF;color:#111;font-weight:800;font-size:13px;height:10mm}
.sg{display:flex;gap:4mm}.sg div{width:38mm;height:24mm;border:.3mm dashed #888;border-radius:4mm;text-align:center;padding-top:2mm;color:#777}
.sf{position:absolute;bottom:8mm;left:0;right:0;display:flex;justify-content:center}.sf div{background:#E3FFF8;border-radius:99px;padding:2mm 8mm}.sf img{height:11mm;display:block}
.lk{display:flex;gap:8px;align-items:center;direction:ltr}.stl img{display:block}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .stl img{filter:invert(1)}}:root[data-theme=dark] .stl img{filter:invert(1)}
.ln{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--l)}.ln:first-child{border:0}
.btn,nav button,.card,.seg button,.cg b,.ch button,.x{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rp .6s ease-out;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.btn{transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-3px);box-shadow:0 8px 18px #0003}.btn:active{transform:scale(.94)}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,#fff9,transparent);transform:skewX(-20deg);pointer-events:none}.btn:hover::after{animation:sh .7s}@keyframes sh{to{left:130%}}

.x{transition:.3s}.x:hover{transform: scale(1.15);background:var(--y);color:#111}

.stats div{transition:.25s}.stats div:hover{transform:translateY(-4px) scale(1.04)}

DR.rows.map((r,i)=>{const o=S.stock[r.n];return `<div class=card><div class=r><b>${fa(i+1)}</b>${DR.rows.length>1?`<button class=x onclick="delR(${i})">✕</button>`:''}</div>`+(sell?`<select onchange="selItem(${i},this.value)"><option value="">انتخاب از انبار…</option>${Object.entries(S.stock).map(([n,s])=>`<option ${n==r.n?'selected':''} value="${esc(n)}">${esc(n)} (${fa(+s.q.toFixed(2))})</option>`).join('')}</select>${o?`<small>قیمت خرید: ${F(o.cost)} · موجودی: ${fa(+o.q.toFixed(2))}</small>`:''}`:`<input list=sl placeholder="نام کالا" value="${esc(r.n)}" oninput="setR(${i},'n',this.value)">`)+`<div class=g3><input inputmode=decimal placeholder=تعداد ${sell&&!r.n?'disabled':''} value="${esc(r.q)}" oninput="setR(${i},'q',this.value)"><input inputmode=decimal placeholder="قیمت ${sell?'فروش':'خرید'} (ریال)" ${sell&&!r.n?'disabled':''} value="${esc(r.p)}" oninput="setR(${i},'p',this.value)">${sell?`<input inputmode=decimal placeholder="تخفیف ٪" ${!r.n?'disabled':''} value="${esc(r.d)}" oninput="setR(${i},'d',this.value)">`:''}</div><div class=r><small>جمع ردیف</small><b id=lt${i}>۰</b></div></div>`}).join('')+
`<button class="btn ghost w" ${DR.rows.length>=15?'disabled':''} onclick="addR()">＋ کالای بعدی (${fa(DR.rows.length)}/۱۵)</button><div class=card style="margin-top:12px"><input inputmode=decimal placeholder="مالیات (ریال) — اختیاری" value="${esc(DR.tax)}" oninput="DR.tax=this.value;upd()" style="margin-bottom:8px"><div class=r><b>جمع کل</b><b id=tot>۰</b></div>${sell?'<div class=r><small>سود این فاکتور</small><b id=ptot>۰</b></div>':''}<div class=r style="border-top:1px solid var(--l);padding-top:8px"><b>قیمت نهایی</b><b id=fin>۰</b></div><button class="btn w" onclick="sub()">ثبت فاکتور و ساخت PDF</button></div>`}
function addR(){if(DR.rows.length<15){DR.rows.push({n:'',q:'',p:'',d:''});render()}}
function delR(i){DR.rows.splice(i,1);render()}
function selItem(i,v){if(v&&DR.rows.some((r,j)=>j!==i&&r.n===v)){toast('این کالا قبلاً در همین فاکتور اضافه شده');render();return}DR.rows[i].n=v;const a=v?availFor(v,i):0;if(N(DR.rows[i].q)>a)DR.rows[i].q=a>0?String(+a.toFixed(2)):'';if(v&&a<=0)toast('موجودی این کالا صفر است');render()}
function availFor(n,ex){const o=S.stock[n];if(!o)return 0;let u=0;DR.rows.forEach((r,j)=>{if(j!==ex&&r.n===n)u+=N(r.q)});return Math.max(0,o.q-u)}
function setR(i,k,v){if(k=='q'&&DR.type=='sell'&&DR.rows[i].n){const a=availFor(DR.rows[i].n,i);if(N(v)>a){v=String(+a.toFixed(2));toast('موجودی این کالا '+fa(+a.toFixed(2))+' عدد است');const el=window.event&&window.event.target;if(el&&el.tagName=='INPUT')el.value=v}}DR.rows[i][k]=v;upd()}
function upd(){let t=0,pf=0;DR.rows.forEach((r,i)=>{const l=N(r.q)*N(r.p)*(1-Math.min(N(r.d),100)/100),o=S.stock[r.n];t+=l;if(DR.type=='sell'&&o)pf+=l-N(r.q)*o.cost;const e=$('#lt'+i);if(e)e.innerHTML=F(l)});$('#tot').innerHTML=F(t);const fe=$('#fin');if(fe)fe.innerHTML=F(t+N(DR.tax));const e=$('#ptot');if(e)e.innerHTML=F(pf)}
function credit(){return S.cr===undefined?10:S.cr}
const PACKS=[{sku:'ronagh_invoices_10',n:10,t:20000},{sku:'ronagh_invoices_30',n:30,t:60000},{sku:'ronagh_invoices_50',n:50,t:100000},{sku:'ronagh_invoices_100',n:100,t:200000}];
function paywall(){modal(`<h3 style="margin:0;text-align:center">فاکتورهای رایگان تمام شد</h3><p style="margin:0;text-align:center;line-height:1.9">شما ۱۰ فاکتور رایگان داشتید. برای ادامه یک بسته انتخاب کنید.</p><small style="text-align:center;color:var(--m)">${window.RonaghBilling?'اتصال به بازار: فعال':'اتصال به بازار: فعال نیست؛ این نسخه از پروژهٔ اندروید (APK ساخته‌شده با Android Studio) نیست'}</small>${PACKS.map(p=>`<button class="btn w" onclick="buyPack('${p.sku}')">${p.n.toLocaleString('fa-IR')} فاکتور — ${p.t.toLocaleString('fa-IR')} تومان (${(p.t*10).toLocaleString('fa-IR')} ریال)</button>`).join('')}<button class="btn ghost w" onclick="closeM()">بعداً</button>`)}
function buyPack(sku){if(window.RonaghBilling){RonaghBilling.buy(sku)}else toast('خرید فقط در برنامهٔ اندروید فعال است')}
function onBillingResult(r){if(typeof r==='string')r=JSON.parse(r);if(!r.ok){toast(r.msg||'خرید انجام نشد');return}S.pt=S.pt||[];if(S.pt.includes(r.token))return;const p=PACKS.find(x=>x.sku===r.sku);if(!p)return;S.pt.push(r.token);S.cr=credit()+p.n;save();closeM();toast('فاکتورهای جدید اضافه شد');render()}
function sub(){if(credit()<=0){paywall();return}const NO=String(DR.no||'').trim();if(!NO)return toast('شماره فاکتور را وارد کنید');if(S.inv.some(x=>String(x.no)===NO))return toast('قبلاً این شماره فاکتور ساخته شده است');const rs=DR.rows.filter(r=>r.n&&N(r.q)>0).map(r=>({n:r.n.trim(),q:N(r.q),p:N(r.p),d:Math.min(N(r.d),100),fa:(r.fa||DR.sa||'').trim(),fn:(DR.sn||'').trim()})),sell=DR.type=='sell';
if(!rs.length)return toast('حداقل یک کالا با تعداد وارد کنید');
if(sell){const nd={};rs.forEach(r=>nd[r.n]=(nd[r.n]||0)+r.q);for(const n in nd){const o=S.stock[n];if(!o||o.q<nd[n])return toast('موجودی «'+n+'» کافی نیست')}}
let total=0,profit=0;
rs.forEach(r=>{const l=r.q*r.p*(1-r.d/100),o=S.stock[r.n];total+=l;if(sell){r.c=o.cost;profit+=l-r.q*o.cost;o.q-=r.q}else if(o){o.cost=(o.q*o.cost+r.q*r.p)/(o.q+r.q);o.q+=r.q;if(r.fa)o.fa=r.fa;if(r.fn)o.fn=r.fn}else S.stock[r.n]={q:r.q,cost:r.p,fa:r.fa,fn:r.fn}});
const v={id:Date.now(),type:DR.type,no:NO,pay:DR.pay||'نقدی',tax:N(DR.tax),date:DR.date,party:sell?DR.party:(DR.sn||''),dest:DR.dest||'',sa:DR.sa||'',sn:DR.sn||'',shop:DR.shop||S.shop,addr:DR.addr,rows:rs,total,profit};S.cr=credit()-1;S.n=Math.max(S.n||0,parseInt(NO)||0);S.inv.push(v);save();DR=fresh(DR.type);
const lw=low().filter(([n])=>rs.some(r=>r.n==n));if(lw.length)toast('⚠️ بحران کالا: '+lw.map(x=>x[0]).join('، '));
show(v.id)}
function pick(){const[y,m]=DR.date.split('/').map(Number);P={y,m};cal()}
function cm(d){P.m+=d;if(P.m>12){P.m=1;P.y++}if(P.m<1){P.m=12;P.y--}cal()}
function cal(){const{y,m}=P,len=m<7?31:m<12?30:leap(y)?30:29,g=j2g(y,m,1),off=(new Date(g[0],g[1]-1,g[2]).getDay()+1)%7;let c='<i></i>'.repeat(off);for(let d=1;d<=len;d++){const s=`${y}/${pad(m)}/${pad(d)}`;c+=`<b class="${s==(P.x==2?HF.date:P.x?XD:DR.date)?'on':''} ${s==TD?'td':''}" onclick="pickSet('${s}')">${fa(d)}</b>`}
modal(`<div class=ch><button onclick=cm(-1)>${LG=='en'?'‹':'›'}</button><span>${MN[m-1]} ${fa(y)}</span><button onclick=cm(1)>${LG=='en'?'›':'‹'}</button></div><div class=wd><span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span></div><div class=cg>${c}</div>`)}
function show(id){const v=S.inv.find(x=>x.id==id),sell=v.type=='sell',g=v.rows.reduce((a,r)=>a+r.q*r.p,0);let rows='';
for(let i=0;i<15;i++){const r=v.rows[i];rows+=r?`<tr><td>${fa(i+1)}</td><td class=l>${esc(r.n)}</td><td>${fa(+r.q.toFixed(2))}</td><td>${FP(r.p)}</td><td>${r.d?fa(r.d)+'٪':'—'}</td><td>${FP(r.q*r.p*(1-r.d/100))}</td></tr>`:'<tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>'}
$('#view').innerHTML=`<div class=vb><button class=btn onclick="window.print()">⬇️ خروجی PDF / چاپ A4</button><button class="btn ghost" style="color:#fff;border-color:#fff" onclick="$('#view').style.display='none'">بستن</button></div>
<div class=sheet id=sh><div class=sh><div class=lg>${S.logo?`<img src="${S.logo}">`:esc((v.shop||'ف')[0])}</div><div class=si><h1>${esc(v.shop)}</h1><p>${esc(v.addr)}</p></div><div class=sm><div class=tt>فاکتور ${sell?'فروش':'خرید'}</div><p>شماره: ${fa(v.no)}</p><p>تاریخ: ${fa(v.date)}</p><p>پرداخت: ${esc(v.pay||'نقدی')}</p></div></div>
<div class=pt>${sell?'خریدار':'فروشنده'}:&nbsp;<b>${esc(v.party)||'—'}</b>${v.dest?`&nbsp;&nbsp;|&nbsp;&nbsp;مقصد: <b>${esc(v.dest)}</b>`:''}${v.sa?`&nbsp;&nbsp;|&nbsp;&nbsp;آدرس: <b>${esc(v.sa)}</b>`:''}</div>

<div class=sf><div><img src="${L}"></div></div></div>`;
